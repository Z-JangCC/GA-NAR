protocol: ganar-lw-independent-v1-final
model:
  backbone: pre_norm_swiglu
  activation: mish
  block_kind: activation_residual_mlp
  blocks: 4
  hidden_dim: 192
  ff_width: 384
  geometry_rank: 96
  delta_width: 384
  layerwise_modulation: normalized_low_rank
  geometry_residual_skip: true
training:
  lambda_rho: 0.0
  lambda_pi: 0.0
  epochs: 400
  patience: 50
  batch_size: 256
  optimizer: AdamW
  lr_max: 0.001
  lr_min: 0.00001
  weight_decay: 0.00001
evaluation:
  formal_seeds: [0, 1, 2]
  primary: standardized_test_mse
  baseline: PM-SwiGLU-hidden128-ff256
  capacity_difference_reported: true
kuramoto64:
  anchor_activation: silu
  anchor_checkpoint: seed-matched PM-SiLU development checkpoint
  correction: trainable input_skip
  anchor_only_final_training: true
activation_baselines: [pm_relu, pm_gelu, pm_tanh, pm_silu, pm_mish, pm_softplus]
