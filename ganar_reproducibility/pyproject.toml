[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ganar-final-submission-reproduction"
version = "0.1.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyyaml", "networkx", "pypower", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ganar_lw_independent*", "implicit_surrogate*", "nonlinear_geometry*"]
