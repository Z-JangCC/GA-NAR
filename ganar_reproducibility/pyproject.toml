[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ga-nar"
version = "0.2.0"
requires-python = ">=3.10"
dependencies = ["numpy", "scipy", "pandas", "pyyaml", "networkx", "pypower", "torch"]

[tool.setuptools.packages.find]
where = ["src"]
include = ["ga_nar*", "ganar_lw_independent*", "implicit_surrogate*", "nonlinear_geometry*"]
